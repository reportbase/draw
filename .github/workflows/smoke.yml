name: Smoke test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # One job a part of the test (tests/smoke.mjs lists them: a part added there is added here), side by side, so
  # the run takes as long as its longest part and a failure names the part to rerun.
  part:
    name: ${{ matrix.part }}
    # On 12 Nov 2026 ubuntu-latest became 26.04, which Playwright 1.56.1 had no Chromium build for ("Playwright
    # does not support chromium on ubuntu26.04-x64"): the job failed before any test ran, and was pinned to 24.04
    # for a day. package.json's playwright is 1.63.0 since, which has one. If a new runner image does it again,
    # raise that version rather than pin the runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [unit, editor, exact, morph, motion, gallery, player, labs]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      # The browser alone: the runner image already carries every library Chromium needs, and
      # --with-deps also pulled ~23 MB of fonts through Ubuntu's mirror, which on 26 Oct ran at
      # 26 kB/s and took 14 of the job's 15 minutes, so the tests were cancelled before they ran.
      - run: npx playwright install chromium
      - run: node tests/smoke.mjs ${{ matrix.part }}

  # The one check named "smoke", as before the test was split: green only when every part is.
  smoke:
    needs: part
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.part.result }}" = "success"
