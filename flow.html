<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flow · a scene written in code</title>
<!--
  THE FLOW PLAYGROUND (18 Nov 2026, Tom: "Proceed", to "a live playground page so you can write flows and watch them
  without going through me"). A flow script on the left, the scene it makes playing on the right, made again a moment
  after each keystroke. It is tvf-flow.js and nothing else on this side: the script is run as it would be by
  `npm run flow`, what `build()` gives is handed to a hidden editor (draw.html?embed=1, THE EMBED AS A CONVERTER, the one
  the animated gallery uses) and the picture that comes back plays on its own. What the library refuses is said under
  the script as it is typed, which is most of what makes writing a flow by hand quick: a pose that is not there, a
  thing shown twice, a word naming nothing, each with its thing's name.

  The picture was the editor's animated SVG, which loops and has no stops. Since 19 Nov 2026 (Tom: "1 3 5 6", the
  third, "Stops in the playground") the hidden editor is asked for the scene file as well and the player beside this
  page plays it: it waits at the end of each beat, the beat being read is lit in the list, and the buttons under the
  picture go to the next beat, the one before, or the start. "Open in the editor" takes the same scene to draw.html. Opened from disk the examples cannot be
  fetched (a browser will not read a neighbour file from file://), so the page starts on the one written into it.
-->
<style>
  :root { --bg: #0e1320; --panel: #151b2b; --line: rgba(255,255,255,.14); --fg: #e6e4ee; --dim: #9aa0b4; --gold: #d4a052; --bad: #ff8f7a; --ok: #7fd1b9; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 650; }
  header h1 span { color: var(--dim); font-weight: 400; }
  select, button, a.btn { font: inherit; color: var(--fg); background: #1a1a21; border: 1px solid rgba(255,255,255,.18); border-radius: 9px; padding: 6px 11px; cursor: pointer; text-decoration: none;
    box-shadow: 0 1px 2px rgba(0,0,0,.22), 0 3px 8px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.06); }
  select:hover, button:hover, a.btn:hover { background: #262630; border-color: rgba(255,255,255,.34); }
  .grow { flex: 1; }
  #ask { flex: 1; min-width: 180px; font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 6px 11px; }
  button:disabled { opacity: .5; cursor: default; }
  main { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(320px, 1fr); min-height: 0; }
  .left { display: grid; grid-template-rows: 1fr auto; min-height: 0; border-right: 1px solid var(--line); }
  textarea { width: 100%; height: 100%; resize: none; border: 0; outline: 0; padding: 14px; background: var(--panel); color: var(--fg);
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; tab-size: 2; white-space: pre; overflow: auto; }
  #say { padding: 9px 14px; border-top: 1px solid var(--line); min-height: 38px; color: var(--dim); font-size: 13px; }
  #say.bad { color: var(--bad); } #say.ok { color: var(--ok); }
  .right { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  #stage { display: grid; place-items: center; padding: 14px; min-height: 0; overflow: hidden; }
  #stage img { max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 10px 34px rgba(0,0,0,.45); }
  #stage .wait { color: var(--dim); }
  #stage { grid-template-rows: 1fr auto; gap: 10px; }
  #stage canvas { max-width: 100%; max-height: 100%; min-height: 0; border-radius: 10px; box-shadow: 0 10px 34px rgba(0,0,0,.45); cursor: pointer; }
  #steps { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); } #steps[hidden] { display: none; } #steps button { padding: 4px 10px; }
  #beats p.now b { color: var(--gold); } #beats p.now { color: var(--fg); }
  #beats { border-top: 1px solid var(--line); padding: 9px 14px; max-height: 34vh; overflow: auto; font-size: 13px; color: var(--dim); }
  #beats b { color: var(--fg); font-weight: 600; } #beats p { margin: 0 0 6px; } #beats em { color: var(--gold); font-style: normal; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 46vh 1fr; } .left { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>flow <span>· a scene written in code</span></h1>
  <select id="pick" title="a flow to start from" aria-label="a flow to start from"></select>
  <input id="ask" type="text" placeholder="describe a scene, and it is written as a flow" aria-label="describe a scene">
  <button id="askGo" title="Claude writes the scene as a flow script; what the library refuses is sent back to be put right">write it</button>
  <a class="btn" id="open" target="_blank" rel="noopener" title="the same scene in the editor: a live morph with its beats, and from there a .tvfs">open in the editor</a>
</header>
<main>
  <div class="left">
    <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="the flow's script"></textarea>
    <div id="say" role="status" aria-live="polite"></div>
  </div>
  <div class="right">
    <div id="stage"><span class="wait" id="pic">the scene plays here</span>
      <div id="steps" hidden><button id="sFirst" title="from the start">⏮</button><button id="sPrev" title="the beat before">◀</button><button id="sNext" title="play on to the end of the next beat">▶</button><span id="sWhere"></span></div></div>
    <div id="beats"></div>
  </div>
</main>
<script src="tvf-flow.js"></script>
<script src="tvf-core.js"></script>
<script src="player/tvf-player.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id), src = $('src'), say = $('say'), stage = $('stage');
  // the one written into the page: a ball, a floor, a fall and a bounce, with every kind of word once
  const STARTER = `// A flow: things with poses, and beats that say what happens, in seconds.
// Change anything; the scene is made again as you type.
export default function ({ flow, draw }) {
  const F = flow({ name: 'A ball', w: 800, h: 500, paper: '#f4f1ea' });

  const floor = F.shape('floor', draw.line([[80, 420], [720, 420]], '#3b4256', 3));
  // one thing, three poses: up, down and squashed on the floor
  const ball = F.shape('ball', [
    draw.ring(400, 110, 46, '#7c5cff'),
    draw.ring(400, 372, 46, '#7c5cff'),
    draw.ring(400, 390, 60, '#7c5cff', 24, 30)]);
  const label = F.shape('label', draw.text(332, 470, 'it comes back', '#3b4256', 24));

  F.beat('A ball above a floor', 'A [ball](ball) hangs over a [floor](floor).', b => {
    b.show(floor, { in: 'draw', dur: 0.8 });
    b.show(ball, { dur: 0.5 });
  });
  F.beat('It falls, and comes back', 'Down, [squashed](ball), and up again.', b => {
    b.go(ball, 1, { dur: 0.7, ease: 'in' });
    b.go(ball, 2, { dur: 0.12, ease: 'out' });
    b.go(ball, 1, { dur: 0.12, ease: 'in' });
    b.go(ball, 0, { dur: 0.7, ease: 'out' });
    b.show(label);
  });
  return F.build();
}
`;
  const FLOWS = [['', 'a ball (start here)'], ['flows/pythagoras.mjs', 'Pythagoras by rearrangement'], ['flows/sort.mjs', 'sorting, bar by bar'], ['flows/fourier.mjs', 'a square wave from sines'], ['flows/kn.mjs', 'K, not N'], ['flows/algebra.mjs', 'a line of algebra, solved'], ['flows/breath.mjs', 'three loops (the gallery\'s, ported)']];
  for (const [file, name] of FLOWS) { const o = document.createElement('option'); o.value = file; o.textContent = name; $('pick').appendChild(o); }

  // THE HIDDEN EDITOR that turns a scene into a picture: one iframe, asked by message, answered by message
  let host = null, hostReady = null, nextId = 1; const waiting = new Map();
  const hostUp = () => hostReady || (hostReady = new Promise(res => {
    host = document.createElement('iframe'); host.title = 'the leaf editor, turning the scene into a picture'; host.setAttribute('aria-hidden', 'true');
    host.style.cssText = 'position:absolute;left:-9999px;top:0;width:480px;height:320px;border:0;visibility:hidden';
    host.src = new URL('draw.html?embed=1', location.href).href;
    host.addEventListener('load', () => setTimeout(res, 400), { once: true }); document.body.appendChild(host); }));
  window.addEventListener('message', e => { const m = e.data;
    if (!host || e.source !== host.contentWindow || !m || m.type !== 'tvf-scene-svg' || !waiting.has(m.id)) return;
    const res = waiting.get(m.id); waiting.delete(m.id); res({ svg: m.svg, tvfs: m.tvfs || null }); });
  const picture = async code => { await hostUp(); const id = nextId++;
    return new Promise(res => { waiting.set(id, res); host.contentWindow.postMessage({ type: 'tvf-scene-svg', id, code, want: 'tvfs' }, '*'); setTimeout(() => { if (waiting.delete(id)) res(null); }, 30000); }); };

  // THE SCRIPT, RUN: as a module, the way `npm run flow` imports it, so what is written here is a file as it stands.
  // IN A BOX OF ITS OWN (18 Nov 2026, with "write it"): a script here may be one nobody has read, written by Claude a
  // moment ago and run as it arrives. So it runs in a frame with no origin (sandbox="allow-scripts"): it has the
  // library and nothing else of this page, not its storage, where the sign-in is kept, nor the editor beside it.
  // What it builds comes back by message, as data.
  let box = null, boxReady = null, runId = 1; const running = new Map();
  const boxUp = () => boxReady || (boxReady = new Promise(res => {
    box = document.createElement('iframe'); box.setAttribute('sandbox', 'allow-scripts'); box.title = 'the flow\'s script, running'; box.setAttribute('aria-hidden', 'true');
    box.style.cssText = 'position:absolute;left:-9999px;top:0;width:10px;height:10px;border:0;visibility:hidden';
    box.srcdoc = '<!doctype html><script src="' + new URL('tvf-core.js', location.href).href + '"><\/script><script src="' + new URL('tvf-flow.js', location.href).href + '"><\/script><script>'
      + 'addEventListener("message", async e => { const m = e.data; if (!m || m.type !== "flow-run") return; let out;'
      + ' const url = URL.createObjectURL(new Blob([m.text], { type: "text/javascript" }));'
      + ' try { const mod = await import(url); if (typeof mod.default !== "function") throw new Error("the script\\u0027s default export is a function of the library");'
      + '  const p = mod.default(self.TVF_FLOW); if (!p || !p.svg || !p.scene) throw new Error("the function returns what F.build() gives");'
      + '  out = { piece: { name: String(p.name), svg: String(p.svg), scene: JSON.parse(JSON.stringify(p.scene)), seconds: +p.seconds } }; }'
      + ' catch (err) { out = { error: String(err && err.message || err) }; } finally { URL.revokeObjectURL(url); }'
      + ' parent.postMessage(Object.assign({ type: "flow-ran", id: m.id }, out), "*"); });'
      + 'parent.postMessage({ type: "flow-box" }, "*");<\/script>';
    window.addEventListener('message', function up(e) { if (e.source === box.contentWindow && e.data && e.data.type === 'flow-box') { window.removeEventListener('message', up); res(); } });
    document.body.appendChild(box); }));
  window.addEventListener('message', e => { const m = e.data;
    if (!box || e.source !== box.contentWindow || !m || m.type !== 'flow-ran' || !running.has(m.id)) return;
    const res = running.get(m.id); running.delete(m.id); res(m); });
  const run = async text => { await boxUp(); const id = runId++;
    const m = await new Promise(res => { running.set(id, res); box.contentWindow.postMessage({ type: 'flow-run', id, text }, '*');
      setTimeout(() => { if (running.delete(id)) res({ error: 'the script did not finish (ten seconds)' }); }, 10000); });
    if (m.error) throw new Error(m.error); return m.piece; };

  let turn = 0, shown = '';
  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  async function make() {
    const mine = ++turn, text = src.value;
    let piece;
    try { piece = await run(text); }
    catch (e) { if (mine !== turn) return; say.className = 'bad'; say.textContent = String(e && e.message || e).replace(/^flow: /, ''); window.__flow.state = { error: say.textContent }; return { error: say.textContent }; }
    if (mine !== turn) return;
    const code = window.TVF_FLOW.code(piece), S = piece.scene;
    say.className = 'ok';
    say.textContent = `${piece.seconds.toFixed(1)} s · ${S.beats.length} beat${S.beats.length === 1 ? '' : 's'} · ${S.morphs.length} thing${S.morphs.length === 1 ? '' : 's'} moving · ${(piece.svg.match(/<(path|polygon|rect|text|circle|ellipse|line)\b/g) || []).length} shapes`;
    $('open').href = 'draw.html#scene=' + code;
    $('beats').innerHTML = S.beats.map((b, i) => `<p><b>${i + 1}. ${esc(b.title)}</b> ${esc(b.text).replace(/\[([^\]]+)\]\(#lit:[\d,]+\)/g, '<em>$1</em>').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')}</p>`).join('');
    window.__flow.state = { seconds: piece.seconds, beats: S.beats.length, morphs: S.morphs.length, code, picture: false };
    if (code === shown) { window.__flow.state.picture = true; return { ok: true }; }
    const got = await picture(code);
    if (mine !== turn) return;
    if (!got || !got.svg) { say.className = 'bad'; say.textContent = 'the editor did not answer with a picture'; return; }
    shown = code;
    if (got.tvfs && window.TVFPlayer) { playIt(piece, got.tvfs); return { ok: true }; }
    // an editor that does not send the scene file (an old copy in the browser's cache): its picture, looping
    const img = new Image(); img.alt = piece.name; img.id = 'pic'; img.src = URL.createObjectURL(new Blob([got.svg], { type: 'image/svg+xml' }));
    img.onload = () => { $('pic').replaceWith(img); $('steps').hidden = true; window.__flow.state.picture = true; };
    return { ok: true };
  }
  // THE PLAYER, AND ITS STOPS. A new canvas for each scene (the last one's frames stop with it); the scene plays to the
  // end of its first beat and waits. The beat being played or waited at is lit in the list; a click on the picture or
  // ▶ plays on, ◀ goes back a beat, ⏮ to the start.
  let ctl = null, tick = 0;
  function playIt(piece, tvfs) {
    if (ctl) { ctl.pause && ctl.pause(); ctl = null; } clearInterval(tick);
    const cv = document.createElement('canvas'), box = /viewBox="0 0 ([\d.]+) ([\d.]+)"/.exec(piece.svg), n = piece.scene.beats.length;
    cv.id = 'pic'; cv.setAttribute('aria-label', piece.name); cv.style.aspectRatio = box ? box[1] + ' / ' + box[2] : '16 / 10'; cv.style.width = '100%';
    $('pic').replaceWith(cv); $('steps').hidden = false;
    const stops = piece.scene.stops || [];
    const where = () => { if (!ctl) return; const at = ctl.playing ? -1 : stops.findIndex(x => Math.abs(x - ctl.t) < 1e-6),      // waiting at a stop: the beat it ends
      k = Math.min(n - 1, at >= 0 ? at : stops.filter(x => x <= ctl.t + 1e-6).length);
      [...$('beats').children].forEach((p, i) => p.classList.toggle('now', i === k));
      $('sWhere').textContent = 'beat ' + (k + 1) + ' of ' + n + (ctl.playing ? '' : ' · waiting');
      Object.assign(window.__flow.state, { beat: k + 1, playing: !!ctl.playing, t: ctl.t }); };
    ctl = window.TVFPlayer.play(cv, tvfs, { autoplay: true, onstop: where });
    ctl.ready.then(() => { window.__flow.state.picture = true; window.__flow.state.player = true; where(); });
    tick = setInterval(where, 200);
  }
  $('sNext').addEventListener('click', () => { if (ctl) ctl.playing ? 0 : ctl.next ? ctl.next() : ctl.play(); });
  $('sPrev').addEventListener('click', () => { if (ctl && ctl.prev) ctl.prev(); });
  $('sFirst').addEventListener('click', () => { if (ctl) { ctl.seek(0); ctl.play(); } });
  let wait = 0; const soon = () => { clearTimeout(wait); wait = setTimeout(make, 350); };
  src.addEventListener('input', () => { try { localStorage.setItem('tvf-flow-playground', src.value); } catch (_) {} soon(); });
  // Tab types two spaces: a script is indented, and Tab leaving the box loses the place
  src.addEventListener('keydown', e => { if (e.key !== 'Tab' || e.shiftKey || e.altKey || e.ctrlKey || e.metaKey) return; e.preventDefault();
    const a = src.selectionStart, b = src.selectionEnd; src.setRangeText('  ', a, b, 'end'); soon(); });
  const load = async file => { if (!file) return STARTER; const r = await fetch(file); if (!r.ok) throw new Error(file + ': ' + r.status); return r.text(); };
  $('pick').addEventListener('change', async () => { try { src.value = await load($('pick').value); } catch (e) { say.className = 'bad'; say.textContent = 'could not read ' + $('pick').value + ' (from disk a page cannot read its neighbours)'; return; }
    try { localStorage.removeItem('tvf-flow-playground'); } catch (_) {} make(); });
  // WRITE IT (18 Nov 2026, Tom: "Proceed with your recomendations", the AI writing flows). The editor's AI is asked for a
  // scene's own fields: shapes' numbers, shares of the loop, keys given again to hold. Asked for a flow it writes a
  // tenth as much, in names and seconds, and what it gets wrong the library says by name. So a refusal is sent back
  // with the script that earned it, and the answer tried again, twice at most. It goes through the same gateway as
  // the editor's (the page holds no key; the sign-in is the editor's, kept in this origin's storage).
  const GATEWAY = 'https://login.tangent.workers.dev', TRIES = 3;
  const SYS = [
    'You write a short animated scene as a JavaScript module for the tvf-flow library. Reply with ONLY the module\'s source: no code fences, no commentary before or after.',
    '',
    'The module is:  export default function ({ flow, draw }) { const F = flow({ name, w, h, paper }); ... return F.build(); }',
    '',
    'THINGS. const t = F.shape(name, pose) or F.shape(name, [pose, pose, ...]). A pose is one svg element, as a string. A thing with several poses can go from one to another; every pose of one thing must be the same kind of element with the same number of points, since the outline of one becomes the outline of the next. A thing that only changes place needs one pose and b.move. Names are unique. Things are drawn in the order they are made, later ones on top.',
    'draw.line(points, stroke, width)   an open line through [[x, y], ...]',
    'draw.poly(points, fill)            a closed outline through [[x, y], ...]',
    'draw.rect(x, y, w, h, fill)        a rectangle (four points)',
    'draw.ring(cx, cy, r, fill, n = 24, ry = r)   a circle or ellipse as n points',
    'draw.circle(cx, cy, r, fill)       a true circle (one pose; it can be moved)',
    'draw.text(x, y, words, fill, size) a label (one pose only: text does not go from pose to pose)',
    '',
    'BEATS. F.beat(title, words, b => { ... }) is a step of the story; the scene pauses at its end. In the words, [a phrase](name, name) lights those things while the beat is read. Inside, each call happens after the one before, in seconds:',
    'b.show(t, { in: "fade" | "draw" | "cut" | "pop", dur, pose })   the thing appears ("draw" for a line drawn on). A thing is not seen until it is shown, and is shown once.',
    'b.go(t, pose, { dur, ease })       to another of its poses, by its number from 0; ease is "inout", "in", "out", "linear", "anticipate" or "overshoot". A list of poses is gone through in turn.',
    'b.hide(t, { out: "fade" | "undraw" | "cut", dur })   it goes, and is not shown again',
    'b.wait(seconds)',
    'b.together(() => { ... })          everything inside starts at the same moment',
    'b.stagger(list, gap, (item, i) => { ... })   the same thing for each item, each starting gap seconds after the last',
    'b.reveal(things, { gap, dur })   b.relay(things, pose, { gap, dur })   b.leave(things, { gap, dur })   b.swap(x, i, y, j, { dur })',
    'b.move(t, [right, down], { dur, ease: "inout" | "linear" })   to another place with no other pose: [right, down] from where the thing is drawn, in the picture\'s units ([0, 0] is home); b.show(t, { at: [right, down] }) shows it somewhere else to begin with. Use move, not poses, when a thing only changes place; anything moves this way, a word or a circle too. For algebra make each term its own draw.text thing and move the terms.',
    'b.act(t, { kind: "bounce" | "fall" | "throw" | "roll" | "sway" | "swing", amount }, { dur })   a motion worked out for a body; such a thing has one pose and is shown by its act',
    '',
    'Keep it under 100 shapes in all, 2 to 5 beats, 8 to 30 seconds. Use plain JavaScript (loops, Math) to work positions out; no imports, no DOM, no timers. Stay inside the w by h picture. Prefer few things that move meaningfully to many that do not.',
  ].join('\n');
  const session = () => { try { return localStorage.getItem('tangent.login.v1') || ''; } catch (_) { return ''; } };
  const model = () => { try { return localStorage.getItem('tangent.aiModel') || 'claude-sonnet-5'; } catch (_) { return 'claude-sonnet-5'; } };
  async function claude(messages) {
    const res = await fetch(GATEWAY + '/v1/messages', { method: 'POST',
      headers: { 'content-type': 'application/json', 'anthropic-version': '2023-06-01', authorization: 'Bearer ' + session() },
      body: JSON.stringify({ model: model(), max_tokens: 8000, system: SYS, messages, stream: true }) });
    if (!res.ok) { const d = await res.json().catch(() => null), msg = d && d.error && d.error.message;
      throw new Error(res.status === 401 ? 'signed out: sign in from the editor\'s AI button, then come back' : msg || 'the request failed (HTTP ' + res.status + ')'); }
    if (!/event-stream/.test(res.headers.get('content-type') || '')) { const d = await res.json(); return ((d.content || []).find(c => c.type === 'text') || {}).text || ''; }
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '', text = '';
    for (;;) { const { done, value } = await rd.read(); if (done) break; buf += dec.decode(value, { stream: true }); let i;
      while ((i = buf.indexOf('\n\n')) >= 0) { const ev = buf.slice(0, i); buf = buf.slice(i + 2); const line = ev.split('\n').find(l => l.startsWith('data:')); if (!line) continue;
        let d; try { d = JSON.parse(line.slice(5)); } catch (_) { continue; }
        if (d.type === 'content_block_delta' && d.delta && d.delta.type === 'text_delta') { text += d.delta.text; say.className = ''; say.textContent = 'writing… ' + text.length + ' characters'; }
        else if (d.type === 'error') throw new Error((d.error && d.error.message) || 'the reply broke off'); } }
    return text; }
  const bare = t => t.replace(/^\s*```[a-z]*\s*\n/i, '').replace(/\n```\s*$/, '').trim() + '\n';
  async function write(what) {
    if (!what.trim()) return;
    if (!session()) { say.className = 'bad'; say.innerHTML = 'not signed in: press the AI button in <a href="draw.html" style="color:inherit">the editor</a> to sign in, then come back'; return { error: 'not signed in' }; }
    const go = $('askGo'); go.disabled = true;
    const messages = [{ role: 'user', content: 'The scene: ' + what.trim() }]; let last = null;
    try {
      for (let n = 1; n <= TRIES; n++) {
        say.className = ''; say.textContent = n === 1 ? 'asking…' : 'put right, try ' + n + '…';
        const text = bare(await claude(messages));
        src.value = text; try { localStorage.setItem('tvf-flow-playground', text); } catch (_) {}
        last = await make();
        if (!last || last.ok) return Object.assign({ tries: n }, last);
        // the refusal, with the script that earned it, goes back as it stands
        messages.push({ role: 'assistant', content: text }, { role: 'user', content: 'That script was refused when it ran: ' + last.error + '\nSend the whole module again, with that put right.' });
      }
      say.className = 'bad'; say.textContent = 'after ' + TRIES + ' tries the script is still refused: ' + last.error;
      return Object.assign({ tries: TRIES }, last);
    } catch (e) { say.className = 'bad'; say.textContent = String(e && e.message || e); return { error: say.textContent }; }
    finally { go.disabled = false; }
  }
  $('askGo').addEventListener('click', () => write($('ask').value));
  $('ask').addEventListener('keydown', e => { if (e.key === 'Enter') write($('ask').value); });
  window.__flow = { state: {}, make, write, set: text => { src.value = text; return make(); } };      // for the checks
  let kept = ''; try { kept = localStorage.getItem('tvf-flow-playground') || ''; } catch (_) {}
  src.value = kept || STARTER; make();
})();
</script>
